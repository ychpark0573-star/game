<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사자성어 맞히기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: #f4f8f5; color: #202820;
  }
  .app {
    width: 100%; max-width: 560px; margin: 0 auto;
    background: #fff; border-radius: 22px; padding: 24px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
  }
  h1 { margin: 4px 0 8px; text-align: center; font-size: clamp(28px, 7vw, 38px); color: #16734b; }
  .sub { text-align:center; color:#58645b; font-size:18px; margin-bottom:22px; }
  .topline { display:flex; justify-content:space-between; gap:10px; font-size:18px; font-weight:bold; margin: 10px 0 18px; }
  .question {
    background:#eef7f0; border-radius:18px; padding:25px 12px;
    text-align:center; margin-bottom:18px;
  }
  .prompt { font-size: clamp(34px, 10vw, 50px); font-weight:800; letter-spacing:5px; color:#174c35; }
  .instruction { font-size:20px; margin-top:14px; }
  label { display:block; font-size:19px; font-weight:bold; margin: 12px 0 8px; }
  input {
    display:block; width:100%; padding:17px 12px; border:2px solid #b8c9bd;
    border-radius:14px; font-size:30px; text-align:center; letter-spacing:8px;
    outline:none;
  }
  input:focus { border-color:#16804f; }
  button {
    width:100%; border:0; border-radius:14px; padding:17px 12px;
    font-size:21px; font-weight:bold; cursor:pointer; margin-top:12px;
  }
  button:focus-visible, input:focus-visible { outline:3px solid #f0bd48; outline-offset:2px; }
  .primary { background:#16804f; color:white; }
  .secondary { background:#e9eee9; color:#26372c; }
  .feedback { min-height:54px; text-align:center; font-size:19px; font-weight:bold; padding:12px 4px 0; line-height:1.5; }
  .meaning { background:#fff7df; border-radius:13px; padding:14px; font-size:18px; line-height:1.5; margin-top:12px; }
  .hidden { display:none; }
  .result { text-align:center; padding:18px 4px; }
  .result .score { font-size:38px; color:#16734b; font-weight:800; margin:18px 0; }
  .small { color:#667168; font-size:15px; text-align:center; margin-top:16px; }
  @media (max-width:380px) { .app {padding:18px;} button {font-size:19px;} }
</style>
</head>
<body>
<main class="app">
  <h1>사자성어 맞히기</h1>
  <div class="sub">즐겁게 한 문제씩 풀어보세요!</div>

  <section id="game">
    <div class="topline">
      <span id="progress">문제 1 / 5</span>
      <span id="score">점수 0점</span>
    </div>
    <div class="question">
      <div class="prompt" id="prompt">고진 □ □</div>
      <div class="instruction">빈칸에 들어갈 두 글자는 무엇일까요?</div>
    </div>
    <label for="answer">정답 두 글자를 입력하세요</label>
    <input id="answer" type="text" maxlength="2" autocomplete="off"
           placeholder="두 글자" aria-label="정답 두 글자" />
    <button class="primary" id="checkBtn">정답 확인</button>
    <button class="secondary" id="hintBtn">뜻 힌트 보기</button>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="meaning hidden" id="meaning"></div>
    <button class="primary hidden" id="nextBtn">다음 문제</button>
  </section>

  <section id="result" class="result hidden">
    <h2>참 잘하셨습니다!</h2>
    <div class="score" id="finalScore">5문제 중 0문제 정답</div>
    <p id="finalMessage" style="font-size:20px;line-height:1.5"></p>
    <button class="primary" id="restartBtn">다시 하기</button>
  </section>
  <div class="small">컴퓨터와 스마트폰에서 모두 사용할 수 있습니다.</div>
</main>

<script>
const allQuestions = [
  {word:"고진감래", meaning:"고생 끝에 즐거움이 온다는 뜻입니다."},
  {word:"일석이조", meaning:"한 가지 일로 두 가지 좋은 결과를 얻는다는 뜻입니다."},
  {word:"동고동락", meaning:"괴로움과 즐거움을 함께한다는 뜻입니다."},
  {word:"천생연분", meaning:"하늘이 맺어 준 아주 좋은 인연이라는 뜻입니다."},
  {word:"전화위복", meaning:"나쁜 일이 오히려 좋은 일로 바뀐다는 뜻입니다."},
  {word:"작심삼일", meaning:"굳게 마음먹은 일이 사흘을 넘기기 어렵다는 뜻입니다."},
  {word:"유비무환", meaning:"미리 준비하면 걱정할 일이 없다는 뜻입니다."},
  {word:"금상첨화", meaning:"좋은 일에 좋은 일이 더해진다는 뜻입니다."},
  {word:"새옹지마", meaning:"인생의 좋은 일과 나쁜 일은 예측하기 어렵다는 뜻입니다."},
  {word:"다다익선", meaning:"많으면 많을수록 좋다는 뜻입니다."}
];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

const $ = id => document.getElementById(id);

function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function startGame() {
  questions = shuffle(allQuestions).slice(0, 5).map(q => ({
    ...q, showFirst: Math.random() < 0.5
  }));
  current = 0; score = 0; answered = false;
  $("game").classList.remove("hidden");
  $("result").classList.add("hidden");
  showQuestion();
}
function showQuestion() {
  const q = questions[current];
  $("progress").textContent = `문제 ${current + 1} / 5`;
  $("score").textContent = `점수 ${score}점`;
  $("prompt").textContent = q.showFirst
    ? q.word.slice(0,2) + " □ □"
    : "□ □ " + q.word.slice(2,4);
  $("answer").value = "";
  $("answer").disabled = false;
  $("feedback").textContent = "";
  $("meaning").textContent = "";
  $("meaning").classList.add("hidden");
  $("checkBtn").classList.remove("hidden");
  $("hintBtn").classList.remove("hidden");
  $("nextBtn").classList.add("hidden");
  answered = false;
  $("answer").focus({preventScroll:true});
}
function normalize(value) {
  return value.replace(/\s/g, "");
}
function checkAnswer() {
  if (answered) return;
  const q = questions[current];
  const typed = normalize($("answer").value);
  if (typed.length !== 2) {
    $("feedback").textContent = "두 글자를 입력해 주세요.";
    return;
  }
  const correct = q.showFirst ? q.word.slice(2,4) : q.word.slice(0,2);
  if (typed === correct) {
    score++;
    $("feedback").textContent = "정답입니다! 참 잘하셨어요.";
  } else {
    $("feedback").textContent = "아쉽습니다. 정답은 " + q.word + "입니다.";
  }
  answered = true;
  $("answer").disabled = true;
  $("score").textContent = `점수 ${score}점`;
  $("meaning").textContent = "뜻: " + q.meaning;
  $("meaning").classList.remove("hidden");
  $("checkBtn").classList.add("hidden");
  $("hintBtn").classList.add("hidden");
  $("nextBtn").classList.remove("hidden");
  $("nextBtn").textContent = current === 4 ? "결과 보기" : "다음 문제";
}
function showHint() {
  $("meaning").textContent = "힌트: " + questions[current].meaning;
  $("meaning").classList.remove("hidden");
}
function nextQuestion() {
  if (current < 4) {
    current++;
    showQuestion();
  } else {
    $("game").classList.add("hidden");
    $("result").classList.remove("hidden");
    $("finalScore").textContent = `5문제 중 ${score}문제 정답`;
    $("finalMessage").textContent = score === 5
      ? "모두 맞히셨습니다! 대단하세요."
      : score >= 3 ? "잘하셨습니다! 다음에는 더 많이 맞혀 보세요."
      : "수고하셨습니다. 다시 도전해 보세요.";
  }
}
$("checkBtn").addEventListener("click", checkAnswer);
$("hintBtn").addEventListener("click", showHint);
$("nextBtn").addEventListener("click", nextQuestion);
$("restartBtn").addEventListener("click", startGame);
$("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") checkAnswer();
});
startGame();
</script>
</body>
</html>
